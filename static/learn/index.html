<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#f6f7fb; --card:#fff; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb;
    --brand:#3b5bdb; --brand-soft:#e7ecff; --ok:#2f9e44; --ok-soft:#e6f6ea;
    --bad:#e03131; --bad-soft:#fdecec; --chip:#fff7e6; --chip-line:#f5c26b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
  .wrap{max-width:860px;margin:0 auto;padding:16px}
  header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  header h1{font-size:20px;margin:0}
  .meta{font-size:13px;color:var(--muted)}
  .bank{background:var(--bg);padding:10px 0 12px;border-bottom:1px solid var(--line)}
  .inline-bank{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;padding-top:10px;border-top:1px dashed #b9c3e6}
  .inline-bank .chip{font-size:15px}
  .bank-title{font-size:13px;color:var(--muted);margin-bottom:8px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:flex;align-items:center;border:2px solid var(--chip-line);background:var(--chip);
        border-radius:999px;overflow:hidden;font-size:17px;font-weight:600}
  .chip button{border:0;background:transparent;font:inherit;color:inherit;cursor:pointer;padding:8px 12px}
  .chip .say{border-left:1px solid var(--chip-line);padding:8px 10px;font-size:16px}
  .chip.used{opacity:.35}
  .chip.used .pick{cursor:default}
  .list{margin-top:14px;display:flex;flex-direction:column;gap:10px}
  .row{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;
       display:grid;grid-template-columns:28px 1fr;gap:8px 10px;align-items:start;cursor:pointer}
  .row.active{border-color:var(--brand);background:var(--brand-soft)}
  .num{font-weight:700;color:var(--brand)}
  .def{font-size:16px;line-height:1.45}
  .slot{grid-column:2;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .blank{min-width:140px;padding:6px 12px;border-bottom:2px dashed #9aa4b2;font-size:17px;font-weight:700;color:var(--brand)}
  .blank.empty{color:#9aa4b2;font-weight:400}
  .row.ok{border-color:var(--ok);background:var(--ok-soft)}
  .row.bad{border-color:var(--bad);background:var(--bad-soft)}
  .answer{font-size:14px;color:var(--bad);font-weight:600}
  .mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 8px;cursor:pointer;font-size:14px}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:16px 0 40px;flex-wrap:wrap}
  .btn{border:0;border-radius:12px;padding:12px 20px;font-size:16px;font-weight:700;cursor:pointer}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:disabled{background:#aab4d8;cursor:not-allowed}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .result{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;font-size:16px}
  .result b{font-size:22px}
  .save{font-size:13px;color:var(--muted);margin-top:6px}
  @media (max-width:520px){ .blank{min-width:110px} .chip{font-size:16px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <div class="meta" id="meta"></div>
  </header>

  <div id="resultBox"></div>

  <div class="bank">
    <div class="bank-title">단어 뱅크 — 🔊를 눌러 몇 번이든 들어 보세요. 문제를 누르면 그 아래에도 단어 뱅크가 나와요.</div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="list" id="list"></div>

  <div class="bar">
    <div class="meta" id="progress"></div>
    <div style="display:flex;gap:8px">
      <button class="btn primary" id="checkBtn">정답 확인</button>
      <button class="btn primary" id="nextBtn" style="display:none">다음 →</button>
    </div>
  </div>
</div>

<script>
/* Streamlit 컴포넌트 연결: app.py 가 보낸 설정(args)을 받아서 시작 */
let CFG = {};
const ST = (type, extra={}) => window.parent.postMessage({isStreamlitMessage:true, type, ...extra}, '*');
let booted = false;
window.addEventListener('message', e => {
  if (e.data && e.data.type === 'streamlit:render' && !booted){
    booted = true; CFG = e.data.args.config || {}; boot();
  }
});
ST('streamlit:componentReady', {apiVersion:1});

/* ---------- 유틸 ---------- */
const $ = id => document.getElementById(id);
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() :
  'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c=='x'?r:(r&3|8)).toString(16);}));

/* ---------- 음성 (브라우저 TTS) ---------- */
let voice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v=>/en[-_]US/i.test(v.lang) && /Google|Samantha|Microsoft/i.test(v.name))
       || vs.find(v=>/en[-_]US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(word){
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'en-US'; u.rate = 0.85; if (voice) u.voice = voice;
  speechSynthesis.speak(u);
}

/* ---------- 상태 ---------- */
let pages = [], runId, runStarted, pageIdx = 0, state;
const allResults = [];
function boot(){
  const words = CFG.words || [];
  const pageSize = CFG.page_size || words.length;
  const order = shuffle(words);                  // 차시 안에서 문제 순서 섞기
  for (let i=0;i<order.length;i+=pageSize) pages.push(order.slice(i,i+pageSize));
  runId = uuid(); runStarted = new Date();
  startPage();
  new ResizeObserver(fitHeight).observe(document.querySelector('.wrap'));
}

function startPage(){
  const items = pages[pageIdx];
  state = {
    items,                                         // 뜻풀이 순서
    bank: shuffle(items.map(w=>w.word)),           // 단어 뱅크 순서
    filled: Array(items.length).fill(null),
    plays: {},                                     // 단어별 듣기 횟수
    firstPick: Array(items.length).fill(null),
    changes: Array(items.length).fill(0),
    active: 0, checked: false, started: new Date()
  };
  render();
}

function render(){
  $('title').textContent = CFG.session_title || '단어 학습';
  $('meta').textContent = `${CFG.student_id||''} · ${pageIdx+1}/${pages.length} 묶음`;
  const used = new Set(state.filled.filter(Boolean));

  const makeChip = w => {
    const c = document.createElement('div');
    c.className = 'chip' + (used.has(w)?' used':'');
    const pick = document.createElement('button'); pick.className='pick'; pick.textContent = w;
    pick.onclick = (e) => { e.stopPropagation(); place(w); };
    const sp = document.createElement('button'); sp.className='say'; sp.textContent='🔊'; sp.title='듣기';
    sp.onclick = (e) => { e.stopPropagation(); play(w); };
    c.append(pick, sp); return c;
  };
  // 위쪽 단어 뱅크 (전체)
  $('chips').innerHTML = '';
  state.bank.forEach(w => $('chips').append(makeChip(w)));

  // 뜻풀이 목록
  $('list').innerHTML = '';
  state.items.forEach((it,i)=>{
    const r = document.createElement('div');
    let cls = 'row';
    if (!state.checked && i===state.active) cls += ' active';
    if (state.checked) cls += (state.filled[i]===it.word ? ' ok' : ' bad');
    r.className = cls;
    const val = state.filled[i];
    r.innerHTML = `<div class="num">${i+1}</div><div class="def">${it.definition}</div>
      <div class="slot"><span class="blank ${val?'':'empty'}">${val||'단어를 고르세요'}</span></div>`;
    const slot = r.querySelector('.slot');
    if (val){
      const b = document.createElement('button'); b.className='mini'; b.textContent='🔊';
      b.onclick = e => { e.stopPropagation(); play(val); }; slot.append(b);
    }
    if (state.checked && state.filled[i]!==it.word){
      const a = document.createElement('span'); a.className='answer';
      a.textContent = `정답: ${it.word}`; slot.append(a);
      const b = document.createElement('button'); b.className='mini'; b.textContent='🔊 정답';
      b.onclick = e => { e.stopPropagation(); play(it.word, true); }; slot.append(b);
    }
    // 선택한 문제 바로 아래 단어 뱅크 (아직 안 쓴 단어만)
    if (!state.checked && i===state.active && !val){
      const ib = document.createElement('div'); ib.className='inline-bank';
      state.bank.filter(w=>!used.has(w)).forEach(w => ib.append(makeChip(w)));
      r.append(ib);
    }
    r.onclick = () => {
      if (state.checked) return;
      if (state.filled[i]) { state.filled[i] = null; }   // 다시 누르면 빼기
      state.active = i; render();
    };
    $('list').append(r);
  });

  const n = state.filled.filter(Boolean).length;
  $('progress').textContent = state.checked ? '' : `${n} / ${state.items.length} 채움`;
  $('checkBtn').style.display = state.checked ? 'none' : '';
  $('checkBtn').disabled = n < state.items.length;
  $('nextBtn').style.display = state.checked ? '' : 'none';
  $('nextBtn').textContent = pageIdx < pages.length-1 ? '다음 묶음 →' : '끝내기';
  fitHeight();
}

/* Streamlit 안에 넣었을 때 iframe 높이를 내용에 맞춤 */
function fitHeight(){
  requestAnimationFrame(()=>{
    ST('streamlit:setFrameHeight', {height: document.querySelector('.wrap').offsetHeight + 10});
  });
}
function scrollTopIntoView(){ setTimeout(()=>document.querySelector('header').scrollIntoView({block:'start'}), 50); }

function play(w, afterCheck=false){
  say(w);
  const key = afterCheck ? w+'#after' : w;
  state.plays[key] = (state.plays[key]||0) + 1;
}

function place(w){
  if (state.checked) return;
  if (state.filled.includes(w)) return;           // 이미 쓴 단어
  let i = state.active;
  if (state.filled[i]) { i = state.filled.findIndex(x=>!x); if (i<0) return; }
  if (state.firstPick[i]===null) state.firstPick[i] = w; else state.changes[i]++;
  state.filled[i] = w;
  const next = state.filled.findIndex(x=>!x);
  state.active = next<0 ? i : next;
  render();
}

/* ---------- 채점 + 저장 ---------- */
$('checkBtn').onclick = async () => {
  state.checked = true;
  const now = new Date();
  const rows = state.items.map((it,i)=>({
    run_id: runId, student_id: CFG.student_id, grp: CFG.group, session_id: CFG.session_id,
    page_no: pageIdx+1, item_no: i+1, word: it.word, word_type: it.type,
    chosen: state.filled[i], first_choice: state.firstPick[i], n_changes: state.changes[i],
    is_correct: state.filled[i]===it.word,
    play_count: state.plays[it.word]||0,
    page_seconds: Math.round((now-state.started)/1000),
    created_at: now.toISOString()
  }));
  allResults.push(...rows);
  render();
  const c = rows.filter(r=>r.is_correct).length;
  $('resultBox').innerHTML = `<div class="result">이번 묶음: <b>${c} / ${rows.length}</b> 맞았어요.
     틀린 단어는 🔊 정답을 눌러 다시 들어 보세요.<div class="save" id="saveMsg">저장 중…</div></div>`;
  const ok = await save('item_responses', rows);
  $('saveMsg').textContent = ok===null ? '(테스트 모드: 저장하지 않음)' : ok ? '기록이 저장되었어요.' : '⚠ 저장 실패 — 선생님께 알려 주세요.';
  fitHeight(); scrollTopIntoView();
};

$('nextBtn').onclick = async () => {
  // 정답 확인 뒤 다시 듣기 횟수도 남김
  const after = Object.entries(state.plays).filter(([k])=>k.endsWith('#after'))
                 .map(([k,v])=>({word:k.replace('#after',''), n:v}));
  if (pageIdx < pages.length-1){
    if (after.length) await save('replay_after_check', after.map(a=>({run_id:runId, student_id:CFG.student_id, session_id:CFG.session_id, page_no:pageIdx+1, word:a.word, play_count:a.n})));
    pageIdx++; $('resultBox').innerHTML=''; startPage(); scrollTopIntoView(); return;
  }
  if (after.length) await save('replay_after_check', after.map(a=>({run_id:runId, student_id:CFG.student_id, session_id:CFG.session_id, page_no:pageIdx+1, word:a.word, play_count:a.n})));
  const c = allResults.filter(r=>r.is_correct).length;
  const end = new Date();
  await save('runs', [{run_id:runId, student_id:CFG.student_id, grp:CFG.group, session_id:CFG.session_id,
      n_items: allResults.length, n_correct: c,
      started_at: runStarted.toISOString(), finished_at: end.toISOString(),
      total_seconds: Math.round((end-runStarted)/1000), user_agent: navigator.userAgent.slice(0,250)}]);
  document.querySelector('.bank').style.display='none';
  $('list').innerHTML=''; $('progress').textContent='';
  $('nextBtn').style.display='none';
  $('resultBox').innerHTML = `<div class="result">🎉 ${CFG.session_title} 끝!<br>
     전체 <b>${c} / ${allResults.length}</b> 맞았어요. 수고했어요.</div>`;
  fitHeight(); scrollTopIntoView();
};

async function save(table, rows){
  const sb = CFG.supabase || {};
  if (!sb.url || !sb.key) { console.log('[test mode]', table, rows); return null; }
  try{
    const res = await fetch(`${sb.url}/rest/v1/${table}`, {
      method:'POST',
      headers:{'apikey':sb.key,'Authorization':`Bearer ${sb.key}`,
               'Content-Type':'application/json','Prefer':'return=minimal'},
      body: JSON.stringify(rows)
    });
    if (!res.ok) console.error(table, res.status, await res.text());
    return res.ok;
  }catch(e){ console.error(e); return false; }
}

</script>
</body>
</html>
